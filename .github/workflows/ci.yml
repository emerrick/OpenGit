name: OpenGit Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - run: yarn install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

      - name: Build (dev)
        run: yarn build:dev

      - name: Generate build tag
        id: build-tag
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          echo "tag=${SHORT_SHA}-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenGit-dev-${{ steps.build-tag.outputs.tag }}
          path: dist/
